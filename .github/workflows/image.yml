# Builds the image and publishes it to GitHub's container registry:
#   push to main  -> ghcr.io/this-aditya/iceberg-load-generator:main and :sha-<commit>
#   tag v0.2.0    -> ghcr.io/this-aditya/iceberg-load-generator:0.2.0 and :latest
#   pull request  -> builds only, publishes nothing
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Registry names must be lowercase, and the account name is This-Aditya.
          images: ghcr.io/this-aditya/iceberg-load-generator
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 for the cluster nodes, arm64 for Apple Silicon laptops.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
